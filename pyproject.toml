[project]
name = "expo-ft"
version = "0.1.0"
description = "EXPO-FT: Sample-Efficient Reinforcement Learning Finetuning for Vision-Language-Action Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpi",
    "openpi-client",
    "absl-py>=2.0.0",
    "cloudpickle>=3.0.0",
    "etils[epath]>=1.5.0",
    "h5py>=3.10.0",
    "optax>=0.2.0",
    "scipy>=1.11.0",
    "tensorflow-probability>=0.23.0",
    "websockets~=13.1",  # 14+ tightened handshake strictness; pin to match client side
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.13", "pynvml==12.0.0"]

[tool.uv.sources]
# The manipulation workspace keeps one OpenPI development checkout next to
# expo-ft. Both packages must resolve to that same company-fork branch.
openpi = { path = "../openpi", editable = true }
openpi-client = { path = "../openpi/packages/openpi-client", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74", "datasets>=3.0,<4.0", "polars==1.30.0"]
